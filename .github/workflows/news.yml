name: Refresh news
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: news
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "carpe-diem-bot"
          git config user.email "carpe-diem-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Refresh news" && git push)
